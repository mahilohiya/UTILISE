name: CI

# This file must live at the repository root (UTILISE/.github/workflows/) to
# be picked up by GitHub Actions at all - it was previously nested inside
# rams-platform/.github/workflows/, which GitHub Actions never reads,
# meaning CI has not actually been running. All steps below use
# working-directory: rams-platform since the actual Node/pnpm project lives
# in that subfolder of this repo (the root also contains the separate Java
# utilISE desktop app).

on:
  push:
    branches: ["main"]
    paths:
      - "rams-platform/**"
  pull_request:
    branches: ["main"]
    paths:
      - "rams-platform/**"

defaults:
  run:
    working-directory: rams-platform

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rams_user
          POSTGRES_PASSWORD: rams_password
          POSTGRES_DB: rams_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('rams-platform/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://rams_user:rams_password@localhost:5432/rams_test_db
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm run build
