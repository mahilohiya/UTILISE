name: Build and Publish Docker Image

# Builds the production image and pushes it to GitHub Container Registry
# (ghcr.io) - free for this repo since it's tied to your GitHub account, no
# separate registry account needed.
#
# Must live at the repo root (see ci.yml's comment for why) - and note the
# build context below is ./rams-platform, not ".", since that's the actual
# Node project root the Dockerfile's COPY paths are relative to.
on:
  push:
    branches: [main]
    paths:
      - "rams-platform/apps/web/**"
      - "rams-platform/packages/database/**"
      - "rams-platform/pnpm-lock.yaml"
      - "rams-platform/pnpm-workspace.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./rams-platform
          file: ./rams-platform/apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
